name: Tap CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate tap scaffold
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tap
        run: bash Scripts/CI/validate-tap.sh
